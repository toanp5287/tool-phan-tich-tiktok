<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Chi tiết hiệu suất nhà bán hàng TikTok Shop" />
    <title>Chi tiết nhà bán hàng | TikTok E-Commerce Analytics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/app.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js" defer></script>
    <script src="https://unpkg.com/vue@3.5.13/dist/vue.global.prod.js" defer></script>
    <script type="module" src="/js/image-fallback.js"></script>
  </head>
  <body>
    <div id="app" v-cloak class="app-shell stack">
      <header class="topbar">
        <div class="brand">
          <a class="brand-mark" href="/shops.html" aria-label="Về danh sách shop">
            <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M15 18l-6-6 6-6" />
            </svg>
          </a>
          <div>
            <h1 class="brand-name">Chi tiết nhà bán hàng</h1>
            <p class="brand-sub">{{ detail?.shop.name || "Đang tải dữ liệu shop..." }}</p>
          </div>
        </div>



        <div class="row">
          <time-filter :model-value="rangeKey" @update:model-value="setRange" />
          <a v-if="detail?.shop.shopUrl" class="btn btn-primary" :href="detail.shop.shopUrl" target="_blank" rel="noopener">
            Mở TikTok Shop
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
              <path d="M7 17 17 7M9 7h8v8" />
            </svg>
          </a>
        </div>
      </header>

      <nav class="breadcrumb" aria-label="Breadcrumb">
        <template v-if="context.category">
          <a href="/categories.html">Ngành hàng</a>
          <span class="sep">/</span>
          <a :href="`${categoryUrl(context.category)}&range=${rangeKey}`">{{ context.category }}</a>
          <template v-if="context.subCategory">
            <span class="sep">/</span>
            <a :href="`${subCategoryUrl(context.category, context.subCategory)}&range=${rangeKey}`">{{ context.subCategory }}</a>
          </template>
        </template>
        <a v-else href="/shops.html">Nhà bán hàng</a>
        <span class="sep">/</span>
        <span class="is-current">{{ detail?.shop.name || "Shop" }}</span>
      </nav>

      <div v-if="error" class="banner">
        <span class="banner-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg></span>
        <div>
          <strong>Không tải được dữ liệu shop.</strong>
          <div class="muted">{{ error }}</div>
        </div>
      </div>

      <div v-if="loading" class="glass panel">
        <div class="state"><span class="spinner"></span><span>Đang tải thông tin shop...</span></div>
      </div>

      <template v-else-if="detail">
        <section class="glass panel">
          <div class="row-between" style="align-items: flex-start">
            <div class="row" style="gap: 16px; align-items: flex-start">
              <div class="avatar" style="width: 76px; height: 76px; border-radius: 20px; font-size: 24px">
                <img :src="detail.shop.avatarUrl" :alt="detail.shop.name" data-fallback-kind="avatar" />
              </div>
              <div>
                <div class="row" style="gap: 8px; flex-wrap: wrap">
                  <span class="pill pill-accent">#{{ detail.shop.id }}</span>
                  <span class="pill pill-neutral">{{ detail.shop.productCount }} sản phẩm</span>
                  <span :class="growthClass(detail.shop.growthRate)">
                    {{ growthIcon(detail.shop.growthRate) }} {{ formatPercent(detail.shop.growthRate) }}
                  </span>
                </div>
                <h2 style="margin: 10px 0 6px; font-size: clamp(20px, 2.4vw, 26px); font-weight: 700; letter-spacing: -0.02em">
                  {{ detail.shop.name }}
                </h2>
                <div class="muted mono" style="font-size: 11.5px">
                  {{ detail.shop.username ? "@" + detail.shop.username : "Chưa có username" }}
                  · Bắt đầu theo dõi {{ formatDate(detail.shop.firstSeenAt) }}
                </div>
              </div>
            </div>
          </div>

          <hr class="divider" style="margin: 20px 0" />

          <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px">
            <div class="glass-soft panel-tight">
              <div class="kpi-label">Tổng GMV</div>
              <div class="kpi-value" style="font-size: 20px; color: var(--positive)">{{ formatCurrency(detail.shop.totalGmv, { compact: true }) }}</div>
            </div>
            <div class="glass-soft panel-tight">
              <div class="kpi-label">Tổng đã bán</div>
              <div class="kpi-value" style="font-size: 20px">{{ formatNumber(detail.shop.totalSales) }}</div>
            </div>
            <div class="glass-soft panel-tight">
              <div class="kpi-label">Lượt xem</div>
              <div class="kpi-value" style="font-size: 20px; color: var(--accent-3)">{{ formatCompact(detail.shop.totalViews) }}</div>
            </div>
            <div class="glass-soft panel-tight">
              <div class="kpi-label">Giá trung bình</div>
              <div class="kpi-value" style="font-size: 20px">{{ formatCurrency(detail.shop.avgPrice, { compact: true }) }}</div>
            </div>
            <div class="glass-soft panel-tight">
              <div class="kpi-label">Sản phẩm / GMV TB</div>
              <div class="kpi-value" style="font-size: 20px">{{ formatCurrency(avgGmvPerProduct, { compact: true }) }}</div>
            </div>
          </div>
        </section>

        <section class="grid grid-2">
          <article class="glass panel">
            <div class="panel-header">
              <div>
                <h2 class="panel-title">Doanh thu GMV theo ngày</h2>
                <p class="panel-subtitle">price × ΔsoldCount từ snapshot lịch sử (bucketDate) · {{ rangeLabel }}</p>
              </div>
            </div>
            <div class="chart-frame is-sm">
              <canvas ref="salesCanvas" role="img" aria-label="Biểu đồ doanh thu GMV shop"></canvas>
            </div>
          </article>

          <article class="glass panel">
            <div class="panel-header">
              <div>
                <h2 class="panel-title">Bóc tách nguồn doanh thu</h2>
                <p class="panel-subtitle">
                  Video · Live · Giỏ hàng · Product card
                  <span v-if="detail.revenueSources.summary.isEstimated" class="pill pill-neutral" style="font-size: 10px">ước tính</span>
                </p>
              </div>
            </div>
            <div class="chart-frame is-sm">
              <canvas ref="revenueCanvas" role="img" aria-label="Biểu đồ nguồn doanh thu shop"></canvas>
            </div>
            <div class="row" style="gap: 16px; flex-wrap: wrap; margin-top: 12px; font-size: 11.5px">
              <span class="muted">Video <strong style="color: var(--accent)">{{ formatPercent(detail.revenueSources.summary.videoShare) }}</strong></span>
              <span class="muted">Live <strong style="color: var(--accent-3)">{{ formatPercent(detail.revenueSources.summary.liveShare) }}</strong></span>
              <span class="muted">Giỏ hàng <strong style="color: var(--positive)">{{ formatPercent(detail.revenueSources.summary.cartShare) }}</strong></span>
              <span class="muted">Product card <strong style="color: var(--warning, #fbbf24)">{{ formatPercent(detail.revenueSources.summary.productCardShare) }}</strong></span>
            </div>
          </article>
        </section>

        <section class="grid grid-2">
          <article class="glass panel">
            <div class="panel-header">
              <div>
                <h2 class="panel-title">Top 10 nhà Affiliate</h2>
                <p class="panel-subtitle">Creator/Affiliate đóng góp GMV lớn nhất cho shop</p>
              </div>
            </div>
            <div v-if="detail.topAffiliates.length === 0" class="state" style="padding: 28px 12px">
              <span>Chưa ghi nhận affiliate cho shop này.</span>
            </div>
            <div v-else class="stack" style="gap: 8px">
              <a
                v-for="(creator, index) in detail.topAffiliates"
                :key="creator.id"
                class="glass-soft panel-tight row-between link-reset"
                :href="`/creator.html?id=${creator.id}&range=${rangeKey}`"
                style="gap: 12px"
              >
                <div class="row" style="gap: 10px; min-width: 0">
                  <span class="rank-badge" :class="{ 'is-top': index < 3 }">{{ index + 1 }}</span>
                  <div class="avatar">
                    <img :src="creator.avatarUrl" :alt="creator.displayName" loading="lazy" data-fallback-kind="avatar" />
                  </div>
                  <div style="min-width: 0">
                    <div class="cell-strong truncate">{{ creator.displayName }}</div>
                    <div class="muted" style="font-size: 10.5px">
                      {{ formatCompact(creator.followerCount) }} followers · {{ formatPercent(creator.engagementRate) }}
                    </div>
                  </div>
                </div>
                <div style="text-align: right">
                  <div class="num" style="color: var(--positive); font-weight: 600">{{ formatCurrency(creator.gmv, { compact: true }) }}</div>
                  <span class="muted" style="font-size: 10.5px">{{ formatNumber(creator.soldCount) }} đã bán</span>
                </div>
              </a>
            </div>
          </article>

          <article class="glass panel">
            <div class="panel-header">
              <div>
                <h2 class="panel-title">Sản phẩm mới (2 tuần)</h2>
                <p class="panel-subtitle">Những sản phẩm mới xuất hiện gần đây</p>
              </div>
            </div>
            <div v-if="detail.newProducts.length === 0" class="state" style="padding: 28px 12px">
              <span>Không có sản phẩm mới trong 2 tuần gần đây.</span>
            </div>
            <div v-else class="stack" style="gap: 8px">
              <a
                v-for="product in detail.newProducts"
                :key="product.id"
                class="glass-soft panel-tight row-between link-reset"
                :href="`/detail.html?id=${product.id}&range=${rangeKey}`"
                style="gap: 12px"
              >
                <div class="row" style="gap: 10px; min-width: 0">
                  <div class="thumb" style="width: 36px; height: 36px; border-radius: 10px">
                    <img :src="product.imageUrl" :alt="product.title" loading="lazy" data-fallback-kind="product" />
                  </div>
                  <div style="min-width: 0">
                    <div class="cell-strong truncate">{{ product.title }}</div>
                    <div class="muted" style="font-size: 10.5px">{{ product.category || "Chưa phân loại" }}</div>
                  </div>
                </div>
                <div style="text-align: right">
                  <div class="cell-strong num">{{ formatCurrency(product.price) }}</div>
                  <span class="muted" style="font-size: 10.5px">{{ formatNumber(product.sales) }} đã bán</span>
                </div>
              </a>
            </div>
          </article>
        </section>

        <section class="glass panel">
          <div class="panel-header">
            <div>
              <h2 class="panel-title">Video xu hướng gốc</h2>
              <p class="panel-subtitle">Xếp theo lượt xem · nhấn để mở video trực tiếp trên TikTok</p>
            </div>
            <div class="segmented" role="group" aria-label="Sắp xếp video">
              <button :class="{ 'is-active': videoSort === 'playCount' }" @click="videoSort = 'playCount'">Lượt xem</button>
              <button :class="{ 'is-active': videoSort === 'diggCount' }" @click="videoSort = 'diggCount'">Lượt thích</button>
              <button :class="{ 'is-active': videoSort === 'engagement' }" @click="videoSort = 'engagement'">Tương tác</button>
            </div>
          </div>

          <div v-if="videosLoading" class="state"><span class="spinner"></span><span>Đang tải video...</span></div>
          <div v-else-if="sortedVideos.length === 0" class="state" style="padding: 32px 12px">
            <span style="font-size: 24px">🎬</span>
            <span>Chưa ghi nhận video có lượt xem cho shop này.</span>
          </div>

          <div v-else class="video-grid">
            <component
              :is="video.videoUrl ? 'a' : 'div'"
              v-for="video in sortedVideos"
              :key="video.productId"
              class="video-card fade-in"
              :href="video.videoUrl || undefined"
              :target="video.videoUrl ? '_blank' : undefined"
              :rel="video.videoUrl ? 'noopener noreferrer' : undefined"
              :title="video.videoUrl ? 'Mở video trên TikTok' : 'Không có link gốc'"
            >
              <div class="video-thumb">
                <img :src="video.imageUrl" :alt="video.title" loading="lazy" referrerpolicy="no-referrer" data-fallback-kind="cover" />
                <span class="play-icon" aria-hidden="true">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z" /></svg>
                </span>
                <span class="views-chip">
                  <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z" /></svg>
                  {{ formatCompact(video.playCount) }}
                </span>
              </div>
              <div class="video-body">
                <div class="video-title">{{ video.title }}</div>
                <div class="video-stats">
                  <span title="Lượt thích">❤ {{ formatCompact(video.diggCount) }}</span>
                  <span title="Bình luận">💬 {{ formatCompact(video.commentCount) }}</span>
                  <span title="Chia sẻ">Chia sẻ {{ formatCompact(video.shareCount) }}</span>
                </div>
                <div class="row-between" style="font-size: 11px">
                  <span class="pill pill-neutral" style="font-size: 10px">{{ video.subCategory || "—" }}</span>
                  <span style="color: var(--positive); font-weight: 600">{{ formatCurrency(video.gmv, { compact: true }) }}</span>
                </div>
              </div>
            </component>
          </div>
        </section>

        <section class="glass">
          <div class="panel-header" style="padding: 20px 22px 0; margin-bottom: 14px">
            <div>
              <h2 class="panel-title">Danh mục sản phẩm</h2>
              <p class="panel-subtitle">{{ detail.products.length }} sản phẩm đang niêm yết</p>
            </div>
          </div>

          <div class="table-wrap" style="margin: 0 22px">
            <table class="data">
              <thead>
                <tr>
                  <th style="min-width: 280px">Sản phẩm</th>
                  <th class="is-numeric">Giá</th>
                  <th class="is-numeric">Đã bán</th>
                  <th class="is-numeric">GMV</th>
                  <th class="is-numeric">Lượt xem</th>
                  <th class="is-numeric">Tăng trưởng</th>
                  <th></th>
                </tr>
              </thead>
              <tbody>
                <tr v-if="detail.products.length === 0">
                  <td colspan="7"><div class="state"><span>Shop chưa có sản phẩm trong khoảng thời gian này.</span></div></td>
                </tr>
                <tr v-for="product in detail.products" :key="product.id" class="fade-in">
                  <td>
                    <div class="cell-title">
                      <div class="thumb">
                        <img :src="product.imageUrl" :alt="product.title" loading="lazy" data-fallback-kind="product" />
                      </div>
                      <div style="min-width: 0">
                        <div class="cell-title-text" :title="product.title">{{ product.title }}</div>
                        <div class="muted" style="font-size: 10.5px">{{ product.category || "Chưa phân loại" }}</div>
                      </div>
                    </div>
                  </td>
                  <td class="is-numeric cell-strong">{{ formatCurrency(product.price) }}</td>
                  <td class="is-numeric">{{ formatNumber(product.sales) }}</td>
                  <td class="is-numeric" style="color: var(--positive); font-weight: 600">{{ formatCurrency(product.gmv, { compact: true }) }}</td>
                  <td class="is-numeric">{{ formatCompact(product.views) }}</td>
                  <td class="is-numeric">
                    <span :class="growthClass(product.growthRate)">{{ growthIcon(product.growthRate) }} {{ formatPercent(product.growthRate) }}</span>
                  </td>
                  <td style="text-align: right">
                    <a class="btn btn-sm" :href="`/detail.html?id=${product.id}&range=${rangeKey}`">
                      Chi tiết
                      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
                        <path d="m9 6 6 6-6 6" />
                      </svg>
                    </a>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
          <div style="height: 20px"></div>
        </section>
      </template>

      <div v-else-if="!loading" class="glass panel">
        <div class="state" style="padding: 64px 16px">
          <span class="empty-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9 4 3h16l1 6"/><path d="M3 9a3 3 0 0 0 6 0 3 3 0 0 0 6 0 3 3 0 0 0 6 0"/><path d="M5 11v8h14v-8"/><path d="M9 19v-6h6v6"/></svg></span>
          <strong>Không tìm thấy nhà bán hàng</strong>
          <span class="muted">Shop có thể đã bị xoá hoặc ID không hợp lệ.</span>
          <a class="btn btn-sm" href="/shops.html">Về danh sách shop</a>
        </div>
      </div>
    </div>

    <script type="module" src="/js/shop-detail.js"></script>
  </body>
</html>
