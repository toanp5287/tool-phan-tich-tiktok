<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TikTok E-Commerce Analytics — TikTok Shop Việt Nam" />
    <title>TikTok Shop Analytics | TikTok E-Commerce</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CSS (Play CDN) — preflight tắt để không đè lên component CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      if (window.tailwind) window.tailwind.config = {
        corePlugins: { preflight: false },
        theme: {
          extend: {
            colors: {
              brand: { DEFAULT: "#2563eb", soft: "#eff6ff", strong: "#1d4ed8" },
            },
            fontFamily: { sans: ["Inter", "system-ui", "sans-serif"] },
          },
        },
      };
    </script>

    <link rel="stylesheet" href="/app/css/light.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js" defer></script>
    <script src="https://unpkg.com/vue@3.5.13/dist/vue.global.prod.js" defer></script>
  </head>
  <body class="bg-slate-50 text-slate-800">
    <div id="app" v-cloak></div>
    <script type="module" src="/app/js/main.js?v=top-nav-workspace"></script>
  </body>
</html>
